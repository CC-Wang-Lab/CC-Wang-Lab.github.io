title_en = "Experimental Investigation on Thermal Spreading of Chip Package Lids – Vapor Chamber Lid & PHP Lid"
title_zh = "Experimental Investigation on Thermal Spreading of Chip Package Lids – Vapor Chamber Lid & PHP Lid"
lead_en  = "This experiment investigates the thermal spreading performance of different chip package lids. The samples are heated from the bottom, while an infrared camera captures their surface temperature distributions. The tested samples include a pure copper plate, a diamond–copper composite, and an additively manufactured copper vapor chamber. For the vapor chamber, various working fluids and filling ratios are evaluated to determine the optimal operating conditions."
lead_zh  = "This experiment investigates the thermal spreading performance of different chip package lids. The samples are heated from the bottom, while an infrared camera captures their surface temperature distributions. The tested samples include a pure copper plate, a diamond–copper composite, and an additively manufactured copper vapor chamber. For the vapor chamber, various working fluids and filling ratios are evaluated to determine the optimal operating conditions."
