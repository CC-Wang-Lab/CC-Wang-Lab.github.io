[[project.section]]
heading_en = "2. Pulsating Inlet Flow Control"
heading_zh = "2. Pulsating Inlet Flow Control"
body_en    = "A solenoid valve combined with a signal generator is used to periodically modulate the inlet flow rate and velocity, generating a pulsed impinging jet. The periodic acceleration and deceleration disturb the near-wall flow field, suppress the continuous development of the thermal boundary layer, and promote its repeated disruption and redevelopment, thereby enhancing local convective heat transfer performance."
body_zh    = "A solenoid valve combined with a signal generator is used to periodically modulate the inlet flow rate and velocity, generating a pulsed impinging jet. The periodic acceleration and deceleration disturb the near-wall flow field, suppress the continuous development of the thermal boundary layer, and promote its repeated disruption and redevelopment, thereby enhancing local convective heat transfer performance."
