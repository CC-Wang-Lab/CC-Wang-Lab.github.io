# Projects — what the lab is measuring and building right now.
#
# Each row here makes ONE card in the grid at /projects/.
# Each row must also have a matching page at projects/<id>.md and zh/projects/<id>.md,
# which is where the researcher writes up the work in Markdown.
#
# THE CROSS-REFERENCES ARE THE POINT:
#   student = an optional id from _data/team.toml; omit it for lab-owned work
#   area    = an id from _data/research.toml
# Nothing is typed twice, and an explicit wrong id fails the build instead of
# rendering blank. An omitted student renders no byline and is never inferred.
#
# Ordering: research area first (research.toml order), then `weight` inside the
# area, lowest first. Leave `weight` out and the project falls to the end of its area.
#
# The area also becomes a filter button above the grid at /projects/. A button is
# drawn only for an area that has at least one project, so nothing here is typed twice.

[[project]]
id       = "gaming-laptop-hybrid-vapor-chamber"
weight   = 3
image    = "/assets/img/test-setups/gaming-laptop-hybrid-vapor-chamber/upper-experimental-system.jpg"
area     = "electronics-cooling"
layout   = "a"
source_slides = [3]
title_en = "Hybrid Vapor Chamber–Heat Pipe Module for Thermal Management of Gaming Laptops"
title_zh = "Hybrid Vapor Chamber–Heat Pipe Module for Thermal Management of Gaming Laptops"
lead_en  = "This experimental system evaluates an additively manufactured hybrid vapor chamber–heat pipe module for the thermal management of gaming laptops. Heat is transferred from the heating block to the test specimen and then conducted through the heat pipes to the fins on both sides. Forced-convection cooling is provided by airflow conditioned through a wind tunnel. An infrared thermal camera positioned below the specimen measures the surface temperature distribution to evaluate temperature uniformity and heat transfer performance."
lead_zh  = "This experimental system evaluates an additively manufactured hybrid vapor chamber–heat pipe module for the thermal management of gaming laptops. Heat is transferred from the heating block to the test specimen and then conducted through the heat pipes to the fins on both sides. Forced-convection cooling is provided by airflow conditioned through a wind tunnel. An infrared thermal camera positioned below the specimen measures the surface temperature distribution to evaluate temperature uniformity and heat transfer performance."
body_en  = "This experimental system evaluates an additively manufactured hybrid vapor chamber–heat pipe module for the thermal management of gaming laptops. Heat is transferred from the heating block to the test specimen and then conducted through the heat pipes to the fins on both sides. Forced-convection cooling is provided by airflow conditioned through a wind tunnel. An infrared thermal camera positioned below the specimen measures the surface temperature distribution to evaluate temperature uniformity and heat transfer performance."
body_zh  = "This experimental system evaluates an additively manufactured hybrid vapor chamber–heat pipe module for the thermal management of gaming laptops. Heat is transferred from the heating block to the test specimen and then conducted through the heat pipes to the fins on both sides. Forced-convection cooling is provided by airflow conditioned through a wind tunnel. An infrared thermal camera positioned below the specimen measures the surface temperature distribution to evaluate temperature uniformity and heat transfer performance."

