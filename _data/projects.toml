[[project]]
id       = "two-phase-closed-loop-thermosyphon"
weight   = 4
image    = "/assets/img/test-setups/two-phase-closed-loop-thermosyphon/system-apparatus.jpg"
area     = "two-phase"
layout   = "b"
source_slides = [4]
title_en = "Two-Phase Closed Loop Thermosyphon (TPCT) cooling system"
title_zh = "Two-Phase Closed Loop Thermosyphon (TPCT) cooling system"
lead_en  = "This visualized two-phase closed-loop thermosyphon cooling system uses 3M™ HFE-7100 electronic fluorinated dielectric fluid as the working fluid. The system consists of a custom-made glass chamber for flow visualization, a ceramic heater, a copper block, a coil-type heat exchanger, and a cooling-water bath, with the operating pressure maintained below 1 atm. The study investigates vapor–liquid interaction, flow competition, and blockage in the condensate return passage during condensate reflux and vapor generation, as well as their effects on heat transfer performance. Experiments were conducted at filling ratios of 13%, 21%, and 45%; cooling-water temperatures of 10℃, 15℃, and 20℃; and input powers of 50, 100, 150, and 200 W."
lead_zh  = "This visualized two-phase closed-loop thermosyphon cooling system uses 3M™ HFE-7100 electronic fluorinated dielectric fluid as the working fluid. The system consists of a custom-made glass chamber for flow visualization, a ceramic heater, a copper block, a coil-type heat exchanger, and a cooling-water bath, with the operating pressure maintained below 1 atm. The study investigates vapor–liquid interaction, flow competition, and blockage in the condensate return passage during condensate reflux and vapor generation, as well as their effects on heat transfer performance. Experiments were conducted at filling ratios of 13%, 21%, and 45%; cooling-water temperatures of 10℃, 15℃, and 20℃; and input powers of 50, 100, 150, and 200 W."
body_en  = "This visualized two-phase closed-loop thermosyphon cooling system uses 3M™ HFE-7100 electronic fluorinated dielectric fluid as the working fluid. The system consists of a custom-made glass chamber for flow visualization, a ceramic heater, a copper block, a coil-type heat exchanger, and a cooling-water bath, with the operating pressure maintained below 1 atm. The study investigates vapor–liquid interaction, flow competition, and blockage in the condensate return passage during condensate reflux and vapor generation, as well as their effects on heat transfer performance. Experiments were conducted at filling ratios of 13%, 21%, and 45%; cooling-water temperatures of 10℃, 15℃, and 20℃; and input powers of 50, 100, 150, and 200 W."
body_zh  = "This visualized two-phase closed-loop thermosyphon cooling system uses 3M™ HFE-7100 electronic fluorinated dielectric fluid as the working fluid. The system consists of a custom-made glass chamber for flow visualization, a ceramic heater, a copper block, a coil-type heat exchanger, and a cooling-water bath, with the operating pressure maintained below 1 atm. The study investigates vapor–liquid interaction, flow competition, and blockage in the condensate return passage during condensate reflux and vapor generation, as well as their effects on heat transfer performance. Experiments were conducted at filling ratios of 13%, 21%, and 45%; cooling-water temperatures of 10℃, 15℃, and 20℃; and input powers of 50, 100, 150, and 200 W."

