# Organizations the lab has worked with.
#
# =============================================================================
#  READ THIS BEFORE THE SITE GOES PUBLIC
# =============================================================================
#
#  These names were transcribed by Claude from the lab's own collage slide on
#  2026-08-19. THEY HAVE NOT BEEN CHECKED BY ANYONE. Two jobs before launch:
#
#  1. CORRECT THE LIST. Some names were read from a small image and may be
#     wrong or misspelled. Rows marked `check = true` are the uncertain ones.
#
#  2. THE NDA CHECK. This is the one that matters. Trademark law is not the
#     real exposure here; contract law is. A non-disclosure agreement often
#     forbids revealing that the relationship exists at all, and no fair-use
#     argument fixes a contract breach. Prof. Wang's office must mark every
#     organization whose agreement forbids disclosure, and those rows must be
#     DELETED, not commented out.
#
#  The section heading is "Organizations we have worked with", never "Our
#  clients" and never "Trusted by". Those imply endorsement, which is the one
#  thing that turns a factual reference into a trademark problem.
# =============================================================================
#
# `logo` is optional. With a file, the logo renders; without one, the NAME
# renders as text in the site's own typeface. So the strip works today and each
# logo appears as its file is dropped into _assets/img/partners/.
#
# `kind`: "industry" or "government". Government bodies are funders. Naming a
# funder is normal academic practice and carries none of the questions above.

