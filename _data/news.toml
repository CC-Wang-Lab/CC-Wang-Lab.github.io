# ============================================================================
#  ALL THREE ITEMS BELOW ARE FILLER TEXT. REPLACE THEM BEFORE LAUNCH.
#
#  They are lorem ipsum in English and Thousand Character Classic in Chinese,
#  which is the same thing for a CJK reader: text that is obviously not content.
#  They are here on purpose, asked for on 2026-09-01, so the carousel, the
#  navigation tab, the grid and the article pages can all be seen working
#  before the laboratory has written a real item.
#
#  Nothing here says anything about the laboratory. That is the point. It is
#  also the risk: this text is PUBLISHABLE, unlike the `placeholder = true`
#  rows it replaced, so it will go live on the next deploy.
#
#  ChatGPT's warning, and it is right: for a lab claiming 20+ active industrial
#  projects, a news page whose newest item is eighteen months old does more
#  reputational damage than having no news page at all. If nobody will update
#  this monthly, remove News from the navigation instead.
# ============================================================================
#
# EVERY ITEM NEEDS AN `id`, and a page to go with it:
#
#     news/<id>.md   and   zh/news/<id>.md
#
# The id is the URL. `id = "lorem-ipsum-dolor"` is /news/lorem-ipsum-dolor/,
# and the card on the home page and the card on /news/ both link to it.
#
# The order here does not matter. The build sorts by date, newest first.
#
# AN ITEM MAY CARRY A PICTURE:
#
#     image = "/assets/img/news/rig-commissioned.jpg"
#
# Optional. Without it the card's face carries the item's own date, set large,
# so a card is never a grey rectangle waiting for a photograph. The face is
# cropped to 16/9 by `object-fit: cover`, the same as every other card here.
#
# `title` and `body` are the CARD. The article itself lives in the page, in
# Markdown, the same way a project's words live in its own page.

