body_en  = "This environmental chamber uses heaters and a proportional–integral–derivative controller to maintain the desired ambient temperature for natural-convection testing. A two-phase thermosyphon fin is tested inside the chamber under natural-convection conditions. This type of fin is intended for cooling 5G internet stations. The research aims to improve the module’s functionality while reducing the amount of working fluid used inside the fin, as the working fluid is the module’s main cost component."
