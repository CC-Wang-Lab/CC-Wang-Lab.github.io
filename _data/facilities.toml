[[item]]
id       = "thermal-fin-natural-convection-chamber"
area     = "heat-exchangers"
image    = "/assets/img/test-setups/thermal-fin-natural-convection-chamber/chamber.jpg"
layout   = "a"
source_slides = [7]
title_en = "Investigation of thermal fins under natural convection -  for thermosyphon and pulsating heat pipe thermal fin and typical fan-less heat sink"
title_zh = "Investigation of thermal fins under natural convection -  for thermosyphon and pulsating heat pipe thermal fin and typical fan-less heat sink"
lead_en  = "This environmental chamber uses heaters and a proportional–integral–derivative controller to maintain the desired ambient temperature for natural-convection testing."
lead_zh  = "This environmental chamber uses heaters and a proportional–integral–derivative controller to maintain the desired ambient temperature for natural-convection testing."
body_en  = "This environmental chamber uses heaters and a proportional–integral–derivative controller to maintain the desired ambient temperature for natural-convection testing. A two-phase thermosyphon fin is tested inside the chamber under natural-convection conditions. This type of fin is intended for cooling 5G internet stations. The research aims to improve the module’s functionality while reducing the amount of working fluid used inside the fin, as the working fluid is the module’s main cost component."
body_zh  = "This environmental chamber uses heaters and a proportional–integral–derivative controller to maintain the desired ambient temperature for natural-convection testing. A two-phase thermosyphon fin is tested inside the chamber under natural-convection conditions. This type of fin is intended for cooling 5G internet stations. The research aims to improve the module’s functionality while reducing the amount of working fluid used inside the fin, as the working fluid is the module’s main cost component."

