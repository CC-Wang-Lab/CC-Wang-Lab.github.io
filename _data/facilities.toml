lead_en  = "This closed-loop external-tube pool-boiling system consists of two cylindrical stainless-steel vessels serving as the evaporator and condenser."
lead_zh  = "This closed-loop external-tube pool-boiling system consists of two cylindrical stainless-steel vessels serving as the evaporator and condenser."
body_en  = "This closed-loop external-tube pool-boiling system consists of two cylindrical stainless-steel vessels serving as the evaporator and condenser. Vapor flows through the upper connection line to the condenser before returning to the evaporator as liquid. A water bath regulates the condensation rate to maintain stable saturation pressure and temperature. The visualized evaporator includes a quartz sight-glass window, cartridge heaters, embedded thermocouples, and differential-pressure transducers. The system evaluates smooth, micro-porous-coated, and enhanced-fin surfaces under different single-tube and tube-bundle arrangements."
body_zh  = "This closed-loop external-tube pool-boiling system consists of two cylindrical stainless-steel vessels serving as the evaporator and condenser. Vapor flows through the upper connection line to the condenser before returning to the evaporator as liquid. A water bath regulates the condensation rate to maintain stable saturation pressure and temperature. The visualized evaporator includes a quartz sight-glass window, cartridge heaters, embedded thermocouples, and differential-pressure transducers. The system evaluates smooth, micro-porous-coated, and enhanced-fin surfaces under different single-tube and tube-bundle arrangements."

