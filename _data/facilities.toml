title_en = "Liquid desiccant air-conditioning system"
title_zh = "Liquid desiccant air-conditioning system"
lead_en  = "This liquid-desiccant air-conditioning system integrates a vapor-compression heat pump with liquid-desiccant dehumidification using CreCOPlus® 5100C ionic liquid and R-407C refrigerant."
lead_zh  = "This liquid-desiccant air-conditioning system integrates a vapor-compression heat pump with liquid-desiccant dehumidification using CreCOPlus® 5100C ionic liquid and R-407C refrigerant."
body_en  = "This liquid-desiccant air-conditioning system integrates a vapor-compression heat pump with liquid-desiccant dehumidification using CreCOPlus® 5100C ionic liquid and R-407C refrigerant. The system consists of a regeneration tower and a dehumidification tower equipped with packed beds, an immersion dehumidifier, a precooling coil, and a reheat coil. The evaporators cool the solution to enhance moisture absorption as the solution directly contacts the air through the packed bed. Condenser heat is used for solution regeneration and air reheating, enabling dehumidification, cooling, and heating operation."
body_zh  = "This liquid-desiccant air-conditioning system integrates a vapor-compression heat pump with liquid-desiccant dehumidification using CreCOPlus® 5100C ionic liquid and R-407C refrigerant. The system consists of a regeneration tower and a dehumidification tower equipped with packed beds, an immersion dehumidifier, a precooling coil, and a reheat coil. The evaporators cool the solution to enhance moisture absorption as the solution directly contacts the air through the packed bed. Condenser heat is used for solution regeneration and air reheating, enabling dehumidification, cooling, and heating operation."

