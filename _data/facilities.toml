body_en  = "This two-phase cooling test platform evaluates two-phase cold plates under controlled operating conditions. The working fluid circulates from the tank through the pump, preheater, flow meter, test section, and condenser before returning to the tank. The system controls the flow rate, pressure, and fluid temperature while recording steady-state thermal and hydraulic data. It is used to evaluate boiling curves, critical heat flux, heat transfer coefficients, thermal resistance, pressure drop, and flow behavior."
