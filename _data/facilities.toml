body_en  = "This external-tube refrigerant test system evaluates refrigerant boiling performance, lubricant–refrigerant mixtures, and enhanced heat transfer surfaces. A heating tube is immersed in the refrigerant within a closed system and operated at heat fluxes of 10–110 kW/m² under different saturation temperatures. The evaporator serves as the boiling test chamber, while the condenser controls the saturation temperature. The 19.05 mm heating tube has a heated length of 115 mm and contains four thermocouples for temperature measurement. A high-speed camera records bubble-generation frequency and departure size."
