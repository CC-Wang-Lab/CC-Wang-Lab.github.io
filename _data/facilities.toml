image    = "/assets/img/test-setups/air-cooler-wind-tunnel/wind-tunnel.jpg"
layout   = "b"
source_slides = [8]
title_en = "Wind tunnel for air-cooler heat sink with Vapor chamber/heat pipe/pulsating heat pipe (and typical air-cooled heat sink)"
title_zh = "Wind tunnel for air-cooler heat sink with Vapor chamber/heat pipe/pulsating heat pipe (and typical air-cooled heat sink)"
lead_en  = "This wind tunnel facility evaluates the thermal performance of air-cooled electronic cooling devices, such as vapor chambers and heat sinks, under controlled airflow conditions."
lead_zh  = "This wind tunnel facility evaluates the thermal performance of air-cooled electronic cooling devices, such as vapor chambers and heat sinks, under controlled airflow conditions."
body_en  = "This wind tunnel facility evaluates the thermal performance of air-cooled electronic cooling devices, such as vapor chambers and heat sinks, under controlled airflow conditions. The device under test is installed in the test section, where a copper heater block reproduces the heat generated by an electronic component. By adjusting the airflow rate and heat input, the cooling capability of the device can be systematically evaluated under different operating conditions."
body_zh  = "This wind tunnel facility evaluates the thermal performance of air-cooled electronic cooling devices, such as vapor chambers and heat sinks, under controlled airflow conditions. The device under test is installed in the test section, where a copper heater block reproduces the heat generated by an electronic component. By adjusting the airflow rate and heat input, the cooling capability of the device can be systematically evaluated under different operating conditions."

