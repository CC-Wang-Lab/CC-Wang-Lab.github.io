# Capabilities — what the lab can DO for a project.
#
# This is deliberately different from research.toml. Research says what we STUDY.
# Capabilities says what we can measure, model, build and validate for a company.
# An industrial engineer reads this page, not the research page.

[[group]]
id      = "experimental"
icon    = "thermometer-half"
title_en = "Experimental thermal engineering"
title_zh = "實驗熱工程"
lead_en  = "Purpose-built rigs for measuring heat transfer and pressure drop under controlled conditions."
lead_zh  = "客製化實驗平台，於受控條件下量測熱傳與壓降。"
items_en = [
  "Pool and flow boiling rigs, including enhanced and porous surfaces",
  "High-speed visualization of bubble dynamics and onset of nucleate boiling",
  "Fin-and-tube and compact heat exchanger test loops",
  "Refrigerant and dielectric working-fluid handling",
  "Calibrated instrumentation with documented uncertainty",
]
items_zh = [
  "池沸騰與流動沸騰實驗平台，含強化與多孔表面",
  "氣泡動力學與起始核沸騰之高速可視化",
  "翅片管與緊湊型熱交換器測試迴路",
  "冷媒與介電工作流體操作",
  "校正過的量測儀器，附不確定度分析",
]

