# Research areas. Six maximum on the home page.
# Each card carries a SCOPE line, not just a category name — an industry visitor
# must see what is covered without clicking.
#
# To add an area: copy a [[area]] block, fill it in, rebuild. No HTML needed.

[[area]]
id      = "electronics-cooling"
image   = "/assets/img/research/electronics-cooling.jpg"
icon    = "cpu"
title_en = "Electronics & AI Cooling"
title_zh = "電子與 AI 散熱"
scope_en = "Air, liquid, two-phase and immersion thermal management, from chip package to full rack."
scope_zh = "空氣、液體、兩相與浸沒式散熱，涵蓋晶片封裝到整櫃系統。"

[[area]]
