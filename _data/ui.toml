[hero]
# THE HEADLINE IS NOT A TOPIC LIST, ON PURPOSE.
#
# It was "Thermal engineering from electronics to energy systems", and the fault
# was not the words: the hero said the SAME topic list three times over. The
# headline listed the topics, the typed line below it listed them again one at a
# time, and the lead listed them a third time. The most valuable line on the
# site was spending itself on what the two lines under it already said better.
#
# So the headline now states the physical fact the whole laboratory exists to
# answer, and everything below it reads as the answer. Keep it that way: if a
# future headline names a research area, it is repeating the typed line again.
title_en = "Thermal engineering grounded in measurement and validated models"
title_zh = "以量測與模型驗證為基礎的熱工程研究"
# THERE IS NO LEAD PARAGRAPH ANY MORE. Asked for directly, 2026-08-20.
#
# It read "Experimental and computational thermal engineering at National Yang
# Ming Chiao Tung University, with {projects} live industrial projects." The
# first half is now the FIRST typed phrase below, at the size the lead used to
# have. The university and the project count were dropped on purpose; both are
# still in the navigation bar and the footer.
#
# The hero is now two lines: the physical fact, and what the laboratory studies.
play_en  = "Play the experiment"
play_zh  = "播放實驗影片"
cta1_en  = "Research areas"
cta1_zh  = "研究領域"
cta2_en  = "Contact us"
cta2_zh  = "聯絡我們"
# The typed line under the headline. It is now the ONLY prose in the hero, and
# it is set at --fs-lg, the size the lead paragraph used to carry.
#
# Six of the seven phrases came from the Write For Me GPT, 2026-08-19, one per
# research area, all 17 to 23 characters so the line does not reflow as it
# types.
#
# The FIRST one breaks that rule at 50 characters, on purpose: it is the old
# lead sentence, and it was asked for. It is first so that it is the phrase
# sitting in the HTML for a crawler and for a visitor with JavaScript off.
# `.typed-line` reserves the height it needs at every width, measured, so the
# buttons underneath still do not jump. Before adding another long phrase,
# re-measure - the reserved height is in `_css/style.css` and it is a number,
# not a guess.
typed_lead_en = "Research areas:"
typed_lead_zh = "研究領域："
typed_en = [
  "Experimental and computational thermal engineering",
  "Immersion cooling",
  "Data-center airflow",
  "Pool and flow boiling",
  "Compact heat exchangers",
  "Heat pump systems",
  "Smart thermal control",
]
typed_zh = [
  "實驗與計算熱工程",
  "浸沒式冷卻",
  "資料中心氣流",
  "池沸騰與流動沸騰",
  "緊湊型熱交換器",
  "熱泵系統",
  "智慧熱控制",
]
motion_pause_en = "Pause motion"
motion_pause_zh = "暫停動態效果"
motion_play_en  = "Play motion"
motion_play_zh  = "播放動態效果"
caption_en = "Onset of nucleate boiling in R1233zd at 2.5 bar on a porous surface with 65% porosity; high-speed footage recorded in the laboratory."
caption_zh = "R1233zd 在 2.5 bar、孔隙率 65% 多孔表面上的起始核沸騰；影像由本實驗室高速攝影記錄。"

