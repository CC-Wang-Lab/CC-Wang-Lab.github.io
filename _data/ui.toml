# Every piece of interface text, in both languages, in one file.
#
# Nothing in _layout/ may contain a hard-coded English or Chinese word.
# If a string appears on screen and is not page content, it belongs here.
# That is what stops the two languages drifting apart.
#
# NOTE: the Chinese below was written by Claude and MUST be reviewed by a
# native Traditional Chinese speaker before launch. Technical terms in
# particular — Taiwanese engineering usage differs from mainland usage.

