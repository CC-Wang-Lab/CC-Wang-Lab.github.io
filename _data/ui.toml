# The contact form on /contact/. THREE fields, on purpose.
#
# The first version asked eight questions, one per line of the prose list it
# replaced. Every extra field is a reason not to send. The four things that list
# asked for now live in the message placeholder, where they guide without
# blocking: somebody who wants to write two lines can write two lines.
[form]
head_en        = "Send us a message"
head_zh        = "傳訊息給我們"
lead_en        = "We reply to every message, and we say honestly whether this laboratory can help."
lead_zh        = "我們會回覆每一封來信，並誠實說明本實驗室能否協助。"

name_en        = "Your name"
name_zh        = "您的姓名"
email_en       = "Email"
email_zh       = "電子郵件"
message_en     = "Message"
message_zh     = "訊息內容"

# The four questions from the old prose list, folded into the placeholder.
message_hint_en = "What you are cooling, the heat load and the temperature limit, what is stopping you now, and your timescale. A few lines is enough."
message_hint_zh = "您要冷卻的對象、熱負載與溫度上限、目前的瓶頸，以及時程。幾行文字即可。"

send_en        = "Send"
send_zh        = "送出"
required_en    = "Required"
required_zh    = "必填"

# Shown under the button when form_endpoint in config.md is still empty.
mailto_note_en = "This opens your email program with the message filled in. Press send there."
mailto_note_zh = "此按鈕會開啟您的郵件程式並填入內容，請在郵件程式中送出。"

sent_en        = "Thank you. Your message is with the laboratory, and we reply to every one."
sent_zh        = "感謝您。訊息已送達實驗室，我們會回覆每一封來信。"
failed_en      = "The message did not send. Please email us directly at ccwang@nycu.edu.tw."
failed_zh      = "訊息未能送出，請直接來信 ccwang@nycu.edu.tw。"
sending_en     = "Sending..."
sending_zh     = "傳送中……"

privacy_en     = "What you write here goes to the laboratory only. It is not passed on, and it is not used for anything but answering you."
privacy_zh     = "您填寫的內容僅送至本實驗室，不會轉交他人，也僅用於回覆您的來信。"

