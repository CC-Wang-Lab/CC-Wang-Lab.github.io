<!--
  Noto Serif TC carries the Chinese glyphs. ET Book has none, so without this
  every Chinese page renders as empty boxes. Google splits CJK faces by
  unicode-range, so English-only pages never download the Chinese subsets.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="{{asset /css/style.css}}" />

<!--
  The lab mark in the browser tab. These files are GENERATED from
  _assets/img/logo-mark.png by scripts/make-icons.py - do not hand-edit them.

  They live here, in style.html, rather than in head.html, because head.html and
  tag.html both insert this file and tag.html is easy to forget.

  The mark is 2.2:1, so the icon is a crop of the fan motif at its centre, not
  the whole mark padded into a square. The whole mark at 16px is a seven-pixel
  smear. Checked at 16px, which is the only size that matters here.
-->
<link rel="icon" href="/assets/icon/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icon/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icon/apple-touch-icon.png" />
<link rel="manifest" href="/assets/icon/site.webmanifest" />
<meta name="theme-color" content="#d89030" />
