<!--
  Noto Serif TC carries the Chinese glyphs. ET Book has none, so without this
  every Chinese page renders as empty boxes. Google splits CJK faces by
  unicode-range, so English-only pages never download the Chinese subsets.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap"
  rel="stylesheet"
/>
