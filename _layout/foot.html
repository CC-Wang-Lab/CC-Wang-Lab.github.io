    </main>

    {{footer}}

    <button id="backToTop" class="shadow" type="button" title="{{ui nav top}}" aria-label="{{ui nav top}}">
      <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
            crossorigin="anonymous"></script>
    <!--
      Every src carries ?v=<content hash>, so a deploy cannot leave a visitor
      on an old script. The ORDER below is the load order: reveal.js is last
      because it reads window.LabMotion and walks the finished DOM.
    -->
    {{scripts motion theme-toggle hero-video news-slider typed partners project-filter profile-layout contact-form cards backtotop reveal}}
    <script>
      window.addEventListener("load", function () {
        document.body.classList.add("loaded");
      });
    </script>
  </body>
