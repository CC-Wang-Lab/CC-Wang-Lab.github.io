<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CC Wang Lab">
  <!--
    PLACEHOLDER MARK — two blades, one hot, one cold, turning about a hub.
    The lab's real logo (two fish, orange and blue, curled into a fan, over
    "CC WANG LAB / INNOVATIVE COOLING SYSTEM") appears in the CFD video.
    Replace this file with the original SVG, or a large PNG, when it arrives.
    Colours sampled from that logo: #D89030 heat, #4080A8 cooling.

    Drawn fat on purpose. Thin strokes disappear at the 38 px navbar size.
    The blue blade is the orange one rotated 180 degrees about (32,32),
    so the two are exactly symmetric.
  -->
  <path d="M31 30 C 26 14, 15 4, 7 11 C 0 18, 9 27, 31 30 Z" fill="#D89030"/>
  <path d="M33 34 C 38 50, 49 60, 57 53 C 64 46, 55 37, 33 34 Z" fill="#4080A8"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#D89030" stroke-width="3.4"/>
  <circle cx="32" cy="32" r="2.2" fill="#4080A8"/>
</svg>
